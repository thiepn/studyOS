name: StudyOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studyos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      APP_ORIGIN: http://localhost:3000
      STUDYOS_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Exact branch commit, not GitHub's synthetic PR merge commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Pure behavior tests
        run: npm test

      - name: Live qualification script syntax
        run: node --check scripts/verify-live-deployment.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build

      - name: Browser Supabase configuration bundle smoke
        run: node scripts/check-browser-config.mjs

      - name: Production server acceptance smoke
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3107 > /tmp/studyos-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! node scripts/acceptance-smoke.mjs; then
            cat /tmp/studyos-server.log
            exit 1
          fi
      - name: Install isolated real-browser testing tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Real browser desktop and mobile evidence
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3107 > /tmp/studyos-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! node scripts/browser-visual-acceptance.mjs; then
            cat /tmp/studyos-browser-server.log
            exit 1
          fi

      - name: Retain screenshot evidence and SHA256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f05-anonymous-browser-evidence
          path: evidence/f05-browser/
          if-no-files-found: warn
          retention-days: 14
